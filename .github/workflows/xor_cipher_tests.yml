name: XOR Cipher Testing

on:
  push:
    branches: ['main', 'master']
    paths:
      - 'xor_cipher/**'
  pull_request:
    branches: ['main', 'master']
    paths:
      - 'xor_cipher/**'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f xor_cipher/requirements-dev.txt ]; then pip install -r xor_cipher/requirements-dev.txt; fi

    - name: Run Pytest
      run: |
        cd xor_cipher
        PYTHONPATH=. pytest
