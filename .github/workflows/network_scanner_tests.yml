name: Network Scanner Testing

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'network_scanner/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'network_scanner/**'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f network_scanner/requirements-dev.txt ]; then pip install -r network_scanner/requirements-dev.txt; fi

    - name: Run Pytest
      run: |
        cd network_scanner
        PYTHONPATH=. pytest
