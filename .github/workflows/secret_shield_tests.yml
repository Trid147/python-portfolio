name: Secret Shield Testing

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'secret_shield/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'secret_shield/**'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f secret_shield/requirements-dev.txt ]; then pip install -r secret_shield/requirements-dev.txt; fi

    - name: Run Pytest
      run: |
        cd secret_shield
        PYTHONPATH=. pytest
