name: Tatar Daily Trainer Testing

on:
  push:
    branches: ['main', 'master']
    paths:
      - 'tatar_word_generator/**'
  pull_request:
    branches: ['main', 'master']
    paths:
      - 'tatar_word_generator/**'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f tatar_word_generator/requirements-dev.txt ]; then pip install -r tatar_word_generator/requirements-dev.txt; fi

    - name: Run Pytest
      run: |
        cd tatar_word_generator
        PYTHONPATH=. pytest
